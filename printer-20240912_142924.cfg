[include mainsail.cfg]
[include stealthburner_led.cfg]
[include config_backup.cfg]
[exclude_object]
[pause_resume]

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[mcu host]
serial: /tmp/klipper_host_mcu

[mcu sb2209]
canbus_uuid: 2e10e75ba1c2

[virtual_sdcard]
path: ~/printer_data/gcodes

[printer]
kinematics: corexz
max_velocity: 300
max_accel: 2500
square_corner_velocity: 6.0

[force_move]
enable_force_move: True

[respond]
default_type: echo
#   Sets the default prefix of the "M118" and "RESPOND" output to one
#   of the following:
#       echo: "echo: " (This is the default)
#       command: "// "
#       error: "!! "
default_prefix:
#   Directly sets the default prefix. If present, this value will
#   override the "default_type".

[scanner]
canbus_uuid: b7ce9a9764d1            
#adjust to suit your scanner 
#serial: /dev/serial/by-id/usb-cartographer_cartographer_
x_offset: 0                          
#adjust for your offset
y_offset: 18.5                         
#adjust for your offset
calibration_method: touch 
sensor: cartographer
sensor_alt: carto
#alternate name to call commands. CARTO_TOUCH etc
#scanner_touch_z_offset: 0.05         
#this is the default and will be overwritten and added to the DO NOT SAVE area by using UI to save z offset

[bed_mesh]
zero_reference_position: 110, 120
# set this to themiddle of your bed

[idle_timeout]
#gcode:
#   A list of G-Code commands to execute on an idle timeout. See
#   docs/Command_Templates.md for G-Code format. The default is to run
#   "TURN_OFF_HEATERS" and "M84".
timeout: 1800
#   Idle time (in seconds) to wait before running the above G-Code
#   commands. The default is 600 seconds.

########################################
# BED
########################################
[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 130

[screws_tilt_adjust]
screw1: -3,24.5
screw1_name: front left screw
screw2: 168,24.5
screw2_name: front right screw
screw3: 168,194.5
screw3_name: rear right screw
screw4: -3,194.5
screw4_name: rear left screw
horizontal_move_z: 10
speed: 200
screw_thread: CW-M4 
# Use CW for Clockwise and CCW for Counter Clockwise

[safe_z_home]
home_xy_position: 111, 120
z_hop: 10

[bed_mesh]
speed: 250
horizontal_move_z: 5
mesh_min: 25, 25
mesh_max: 197, 217
probe_count: 20,22
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2

########################################
# FANs and TEMP
########################################
[heater_fan hotend_fan]
pin: sb2209:gpio14
max_power: 1.0
kick_start_time: 0.1
heater: extruder
heater_temp: 50.0

[fan]
pin: sb2209:gpio13
max_power: 1.0
kick_start_time: 0.1
off_below: 0.13

[temperature_sensor Pi]
sensor_type: temperature_host
min_temp: 0
max_temp: 100

[temperature_fan MCU]
pin: PA0             
kick_start_time: 0.500
sensor_type: temperature_mcu
control: watermark
target_temp: 1
min_temp: 0
max_temp: 100
max_speed: 0.7
min_speed: 0.7

########################################
# Steppers
########################################
[stepper_x]
step_pin: PB9
dir_pin: !PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: sb2209:gpio24
position_endstop: 222
position_min: 0
position_max: 222
homing_speed: 80
homing_positive_dir: True

[stepper_y]
step_pin: PB7
dir_pin: !PB8
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_min: 0
position_max: 240
homing_speed: 80

[stepper_z]
step_pin: PB5
dir_pin: !PB6
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 250
homing_speed: 80

[extruder]
step_pin: sb2209:gpio18
dir_pin: sb2209:gpio19
enable_pin: !sb2209:gpio17
microsteps: 16
rotation_distance: 4.35
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: sb2209:gpio7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: sb2209:gpio27
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 300
min_extrude_temp: 0

[tmc2209 extruder]
uart_pin: sb2209:gpio20
run_current: 0.650
stealthchop_threshold: 0

########################################
# Tuning
########################################
# [input_shaper]
# shaper_freq_x: 40.2
# shaper_type_x: ei
# shaper_freq_y: 
# shaper_type_y: mzv

# [lis2dw]
# cs_pin: scanner:PA3
# spi_bus: spi1

# [resonance_tester]
# accel_chip: lis2dw
# probe_points: 111, 111, 20

[adxl345]
cs_pin: sb2209:gpio1
spi_software_sclk_pin: sb2209:gpio2
spi_software_mosi_pin: sb2209:gpio0
spi_software_miso_pin: sb2209:gpio3
axes_map: z,-y,x

[resonance_tester]
accel_chip: adxl345
probe_points: 111, 111, 20

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
#    The folder where the results will be stored. It will be created if it doesn't exist.
number_of_results_to_keep: 3
#    The number of results to keep in the result_folder. The oldest results will
#    be automatically deleted after each runs.
keep_raw_csv: False
#    If True, the raw CSV files will be kept in the result_folder alongside the
#    PNG graphs. If False, they will be deleted and only the graphs will be kept.
show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for "system" macros that are not in the
#    printer.cfg file. If you want to see the macros in the webui, set this to True.
timeout: 300
#    The maximum time in seconds to let Shake&Tune process the CSV files and generate the graphs.

#####################################################################
# Macros
#####################################################################
[gcode_macro BED_TRAMMING]
gcode:
    G28
    SCREWS_TILT_CALCULATE

[gcode_macro START_PRINT]
gcode:
#   Use PRINT_START for the slicer starting script - please customize for your slicer of choice
description: start
gcode:
    {% set bed_temperature = params.BED_TEMP %}
    {% set extruder_temperature = params.EXTRUDER_TEMP %}
  
    STATUS_HEATING ; set led status to heating
      
    M140 S{bed_temperature} ; set bed temp
  
    G90 ; absolute position
    M107 ; fans off
    M82 ; e absolute

    M190 S{bed_temperature} ; wait for bed temperature
    G28 ; home all axis
    G29 ; create mesh
    CARTOGRAPHER_TOUCH
    M104 S150 ; set temporary nozzle temperature to prevent oozing
    G1 X220 Y0 F4000 ; move nozzle to corner
    M109 S{extruder_temperature} ; wait for nozzle temperature
      
    STATUS_PRINTING ; set led status to printing
  
    G92 E0
    G1 Z0.3 ; Start close to bed
    G1 X221.5 Y150.0 Z0.3 F2000.0 E15 ; Draw the first line
    G1 X221 Y150.0 Z0.3 F5000.0 ; Move to side a little
    G1 X221 Y20 Z0.3 F2000.0 E25 ; Draw the second line
    G1 Z0.5 F500
    G1 E-0.1 F2000
    G92 E0

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
    PAUSE_BASE
    _TOOLHEAD_PARK_PAUSE_CANCEL

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    ##### read extrude from  _TOOLHEAD_PARK_PAUSE_CANCEL  macro #####
  
    {% set extrude = printer['gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL'].extrude %}
    #### get VELOCITY parameter if specified ####
    {% if 'VELOCITY' in params|upper %}
      {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
    {%else %}
      {% set get_params = "" %}
    {% endif %}
    ##### end of definitions #####
    {% if printer.extruder.can_extrude|lower == 'true' %}
      M83
      G1 E{extrude} F2100
      {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}

  RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
    ## Move head and retract only if not already in the pause state and park set to true
  
    {% if printer.pause_resume.is_paused|lower == 'false' and park|lower == 'true'%}
      _TOOLHEAD_PARK_PAUSE_CANCEL
    {% endif %}
  
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE

[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: park toolhead used in PAUSE and CANCEL_PRINT
variable_extrude: 1.0
gcode:
    ##### set park positon for x and y #####
    # default is your max posion from your printer.cfg
  
    {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
    {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
    {% set z_park_delta = 2.0 %}
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - z_park_delta) %}
      {% set z_safe = z_park_delta %}
    {% else %}
      {% set z_safe = max_z - act_z %}
    {% endif %}
    ##### end of definitions #####
    {% if printer.extruder.can_extrude|lower == 'true' %}
      M83
      G1 E-{extrude} F2100
      {% if printer.gcode_move.absolute_extrude |lower == 'true' %} M82 {% endif %}
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
      G91
      G1 Z{z_safe} F900
      G90
      G1 X{x_park} Y{y_park} F6000
      {% if printer.gcode_move.absolute_coordinates|lower == 'false' %} G91 {% endif %}
    {% else %}
      {action_respond_info("Printer not homed")}
    {% endif %}

[gcode_macro END_PRINT]
gcode:
    # Turn off bed, extruder, and fan
    TURN_OFF_HEATERS
    M107
    
    {% set x = params.X|default(222) %}      #edit to your park position
    {% set y = params.Y|default(240) %}      #edit to your park position
    {% set z = params.Z|default(20)|float %} #edit to your park position
    {% set e = params.E|default(7) %}        #edit to your retract length
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set lift_z = z|abs %}
    {% if act_z < (max_z - lift_z) %}
        {% set z_safe = lift_z %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    G91
    G1 E-{e} F2100
    G1 Z{z_safe}
    G90
    G1 X{x} Y{y} F6000

    STATUS_READY ; set led status to ready

[gcode_macro PID_Tune_Bed]
gcode:
    PID_CALIBRATE HEATER=heater_bed TARGET=80

[gcode_macro PID_Tune_Hotend]
gcode:
    PID_CALIBRATE HEATER=extruder TARGET=240

[gcode_macro G29]
gcode:
    STATUS_MESHING ; set led status to meshing
    
    G91
    G1 Z1
    G90
    BED_MESH_CALIBRATE

    STATUS_READY ; set led status to ready

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : False ; use custom park coordinates for x,y [True/False]
variable_custom_park_x    : 220.0 ; custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 240.0 ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 15.0  ; custom dz value; the value in mm to lift the nozzle when move to park position
variable_retract          : 1.0   ; the value to retract while PAUSE
variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
variable_speed_retract    : 35.0  ; retract speed in mm/s
variable_unretract        : 1.0   ; the value to unretract while RESUME
variable_speed_unretract  : 35.0  ; unretract speed in mm/s
variable_speed_hop        : 15.0  ; z move speed in mm/s
variable_speed_move       : 100.0 ; move speed in mm/s
variable_park_at_cancel   : False ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
# !!! Caution [firmware_retraction] must be defined in the printer.cfg if you set use_fw_retract: True !!!
variable_use_fw_retract   : False ; use fw_retraction instead of the manual version [True/False]
variable_idle_timeout     : 1800  ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
#                                   Specify the config name of the runout sensor e.g "filament_switch_sensor runout". Hint use the same as in your printer.cfg
# !!! Custom macros, please use with care and review the section of the corresponding macro.
# These macros are for simple operations like setting a status LED. Please make sure your macro does not interfere with the basic macro functions.
# Only  single line commands are supported, please create a macro if you need more than one command.
variable_user_pause_macro : ""    ; Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
variable_user_resume_macro: ""    ; Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
variable_user_cancel_macro: "STATUS_READY"    ; Everything inside the "" will be executed before the klipper base cancel (CANCEL_PRINT_BASE) function
gcode:

[delayed_gcode startup]
initial_duration: 1
gcode:
    STATUS_READY

